<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#5A1A38}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz Pemasaran Jasa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* QuizLearn: tema soft pink-putih-abu dengan efek kaca (glass).
   Tata letak: satu kolom sempit seperti aplikasi HP, kartu kaca di atas latar abu bergradasi,
   navigasi melayang di bawah. Semua warna diatur lewat variabel di bawah ini. */
:root{
  --bg:#E8E8E8;
  --ink:#5A1A38;            /* warna teks: rose tua agar terbaca di atas putih/pink */
  --ink-2:#4F4F4F;
  --ink-deep:#3B0F25;       /* teks di atas abu #8C8C8C (tombol ragu-ragu) */
  --on-pink-2:#7A2E4D;      /* teks sekunder di atas pink */
  --pink:#F7C3D5;           /* soft pink utama (isi tombol, kartu, item terpilih) */
  --pink-2:#F0A8C2;         /* soft pink sedikit lebih dalam (ujung gradasi) */
  --pink-line:#E07BA3;      /* soft pink untuk garis, border, fokus, grafik */
  --glass:rgba(255,255,255,.52);
  --glass-hi:rgba(255,255,255,.72);
  --edge:rgba(255,255,255,.82);
  --track:rgba(224,123,163,.22);
  --shadow:0 8px 24px rgba(214,100,145,.07), inset 0 1px 0 rgba(255,255,255,.9);
  --dark-1:#F7C3D5;
  --dark-2:#F0A8C2;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink-line);outline-offset:2px}
.on-dark :focus-visible{outline-color:var(--ink)}

/* latar */
.bg{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(320px 320px at 100% 0%, #fff 0%, rgba(255,255,255,0) 70%),
    radial-gradient(320px 320px at 0% 42%, rgba(240,150,185,.42) 0%, rgba(240,150,185,0) 70%),
    radial-gradient(340px 340px at 100% 86%, rgba(235,135,175,.38) 0%, rgba(235,135,175,0) 70%),
    linear-gradient(165deg,#F6F6F6 0%,#DCDCDC 48%,#F0F0F0 100%);
}

/* kerangka */
.app{
  max-width:520px;margin:0 auto;
  padding-block:20px 120px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:40px;height:40px;border-radius:12px;background:linear-gradient(180deg,var(--pink),var(--pink-2));color:var(--ink);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--ink-2)}
main{display:flex;flex-direction:column;gap:14px;min-width:0;outline:none}

h1.h1{margin:6px 0 0;font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
h2.h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
h3.h3{margin:0;font-size:15px;font-weight:700}
.lead{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pink-line);flex:none}
.muted{color:var(--ink-2)}
.small{font-size:12px}

/* kaca */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(125%);
  backdrop-filter:blur(20px) saturate(125%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.card{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* tombol */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 20px;border-radius:23px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(180deg,var(--dark-1),var(--dark-2));
  color:var(--ink);font-weight:700;
  box-shadow:0 8px 18px rgba(214,100,145,.30), inset 0 1px 0 rgba(255,255,255,.55);
  text-align:center;
}
.btn[disabled]{background:rgba(224,123,163,.18);color:#5A5A5A;box-shadow:none;border-color:transparent;cursor:not-allowed}
.btn-ghost{
  background:var(--glass-hi);color:var(--ink);border:1px solid var(--edge);
  box-shadow:0 4px 12px rgba(214,100,145,.06), inset 0 1px 0 rgba(255,255,255,.9);
}
.btn-ghost[disabled]{background:rgba(255,255,255,.35);color:#5A5A5A}
.btn-light{background:rgba(255,255,255,.94);color:var(--ink);border-color:rgba(255,255,255,.9);box-shadow:none}
.btn-sm{min-height:40px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 120px}
.back{
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;
  padding:0 14px 0 10px;border-radius:20px;border:1px solid var(--edge);background:var(--glass-hi);font-weight:600;font-size:13px;
}

/* progress */
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pink-2),var(--pink-line))}

/* statistik */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.stat svg{display:block}
.stat b{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;line-height:1.3;color:var(--ink-2)}

/* kartu gelap */
.dark{
  position:relative;overflow:hidden;color:var(--ink);
  background:linear-gradient(135deg,rgba(247,195,213,.96),rgba(240,168,194,.98));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 32px rgba(214,100,145,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.dark::before{
  content:"";position:absolute;top:-70px;right:-50px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%);pointer-events:none;
}
.dark>*{position:relative}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-pink-2)}
.dark .meta{color:var(--on-pink-2);font-size:13px}
.cta{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.cta .grow{flex:1 1 160px;display:flex;flex-direction:column;gap:3px}
.cta .t{font-size:17px;font-weight:700;line-height:1.25}

/* daftar bab */
.listbtn{
  width:100%;text-align:left;flex-direction:row;align-items:center;gap:12px;color:var(--ink);
}
.listbtn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.listbtn .tt{font-weight:700;font-size:15px;line-height:1.3}
.listbtn .ds{font-size:12px;color:var(--ink-2)}
.num{
  flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);
  background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(210,210,210,.6));
  display:flex;align-items:center;justify-content:center;font-weight:800;
  box-shadow:0 6px 14px rgba(214,100,145,.08), inset 0 1px 0 #fff;
}

.note{font-size:12px;color:var(--ink-2);line-height:1.5}

/* soal */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:14px;
  background:var(--glass-hi);border:1px solid var(--edge);font-size:12px;font-weight:600;
}
.qtext{margin:0;font-size:17px;font-weight:700;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:18px;
  background:var(--glass-hi);border:1px solid var(--edge);
  box-shadow:0 4px 12px rgba(214,100,145,.05), inset 0 1px 0 rgba(255,255,255,.9);
  line-height:1.4;
}
.opt .lt{
  flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--pink-line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0;
}
.opt .tx{flex:1;min-width:0}
.opt .tag{display:block;margin-top:4px;font-size:12px;font-weight:700}
.opt.sel{background:var(--pink);color:var(--ink);border-color:var(--pink-line)}
.opt.sel .lt{border-color:#fff;background:#fff;color:var(--ink)}
.opt.ok{background:var(--pink);color:var(--ink);border-color:var(--pink-line)}
.opt.ok .lt{border-color:#fff;background:#fff;color:var(--ink)}
.opt.bad{background:rgba(255,255,255,.9);border:2px dashed var(--pink-line)}
.opt.bad .tx>span:first-child{text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.og{display:flex;flex-direction:column;gap:8px}
.ex{margin:0 4px;border-radius:14px;padding:10px 14px;background:var(--glass-hi);border:1px solid var(--edge);display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.5}
.ex.ok{border:1.5px solid var(--pink-line)}
.ex.bad{border:1.5px dashed var(--pink-line)}
.ex b{display:flex;align-items:center;gap:6px;font-size:13px}
.ex p{margin:0}
.fb{border-radius:18px;padding:14px;background:var(--glass-hi);border:1px solid var(--edge);display:flex;flex-direction:column;gap:4px}
.fb b{font-size:15px;display:flex;align-items:center;gap:8px}
.fb p{margin:0;line-height:1.55}

/* ujian */
.timer{
  margin-left:auto;background:var(--pink);color:var(--ink);border-color:var(--pink-line);font-weight:700;font-variant-numeric:tabular-nums;
}
.timer[data-low="1"]{background:#fff;color:var(--ink);text-decoration:underline}
.chip-btn{position:relative;cursor:pointer;color:var(--ink)}
.chip-btn::after{content:"";position:absolute;inset:-8px -4px}
.ctl{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:10px}
.ctl .btn{padding:0;min-width:0}
.btn-step{line-height:1}
.btn-step svg{display:block;flex:none}
.btn-ragu[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:var(--pink-line)}
.nb{position:relative}
.nb.ragu{background:#8C8C8C;border-color:#8C8C8C;color:var(--ink-deep)}
.nb.ragu .l{color:var(--ink-deep)}
.nb .n{font-size:15px}
#overlay:empty{display:none}
.ov{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background:rgba(240,160,195,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.sheet{
  width:100%;max-width:440px;max-height:calc(100% - 8px);overflow:auto;border-radius:24px;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  background:rgba(255,255,255,.9);border:1px solid var(--edge);box-shadow:0 24px 60px rgba(214,100,145,.28);
}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{
  width:40px;height:40px;border-radius:20px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;border:1px solid rgba(224,123,163,.6);background:#fff;font-style:normal;font-weight:800;font-size:11px;color:var(--ink)}
.lg-done{background:var(--pink);border-color:var(--pink-line);color:var(--ink)}
.lg-now{border:2.5px solid var(--pink-line)}
.lg-ragu{background:#8C8C8C;border-color:#8C8C8C;color:var(--ink-deep)}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.nb{
  min-height:54px;border-radius:14px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:0;
  font-variant-numeric:tabular-nums;
}
.nb .n{font-size:15px;font-weight:800}
.nb .l{font-size:12px;font-weight:700;color:var(--ink-2)}
.nb.done{background:var(--pink);border-color:var(--pink-line);color:var(--ink)}
.nb.done .l{color:var(--ink)}
.chip-ico{padding:0;width:36px;justify-content:center}
.chip-ico svg{display:block}
.cdisp{border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.7);border:1px solid var(--edge);display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:2px;min-height:84px;overflow:hidden}
.cdisp .ce{font-size:13px;color:var(--ink-2);min-height:20px;max-width:100%;white-space:nowrap;overflow:hidden}
.cdisp .cd{font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;max-width:100%;white-space:nowrap;overflow:hidden}
.ckeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ck{height:52px;border-radius:16px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;box-shadow:0 4px 12px rgba(214,100,145,.05), inset 0 1px 0 rgba(255,255,255,.9)}
.ck svg{display:block}
.ck.fn{background:rgba(224,123,163,.18)}
.ck.op{background:linear-gradient(180deg,var(--dark-1),var(--dark-2));color:var(--ink);border-color:rgba(255,255,255,.18)}
.ck:active{transform:scale(.96)}
.nb.bad{background:rgba(255,255,255,.9);border:2px dashed var(--pink-line)}
.sheet-h h2.h2{font-size:19px}
.nb.now{border:3px solid var(--pink-line);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.nb.done.now{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--pink-line)}
.confirm{border-radius:18px;padding:14px;background:rgba(255,255,255,.9);border:2px solid var(--pink-line);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;line-height:1.5}
ol.rules,ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.5}

/* hasil */
.score{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;font-weight:700;color:var(--ink-2);letter-spacing:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two .glass{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.two b{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.two span{font-size:12px;color:var(--ink-2)}

/* riwayat */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge);
}
.hist .hn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hist .hn b{font-size:13px}
.hist .hn span{font-size:12px;color:var(--ink-2)}
.hist .nv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
/* penguasaan */
.mast,.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge)}
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mt{font-weight:700;font-size:14px;line-height:1.35;min-width:0}
.mbot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{
  flex:none;display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:12px;
  font-size:11px;font-weight:700;white-space:nowrap;border:1.5px solid var(--pink-line);background:#fff;color:var(--ink);
}
.pill-kuasai{background:var(--pink);color:var(--ink)}
.pill-belum{border-style:dashed}
.pill-data{border-color:rgba(224,123,163,.6);color:var(--ink-2);font-weight:600}
.qlist li{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge)}
.qt{font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
textarea{
  width:100%;min-height:96px;resize:vertical;padding:12px;border-radius:16px;border:1px solid var(--edge);
  background:rgba(255,255,255,.85);line-height:1.4;
}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--pink-line);outline-offset:2px}
.empty{margin:0;padding:18px 8px;text-align:center;color:var(--ink-2);line-height:1.5}

/* grafik */
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:rgba(224,123,163,.25);stroke-width:1}
.chart text{font-family:var(--font);font-size:10px;fill:var(--ink-2)}
.chart .ln{fill:none;stroke:var(--pink-line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:#fff;stroke:var(--pink-line);stroke-width:2.5}
.chart .pe{fill:var(--pink-line);stroke:#fff;stroke-width:2}
.chart .tip{fill:var(--pink-2)}
.chart text.tipt{fill:var(--ink);font-weight:700;font-size:11px}

/* navigasi bawah */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  pointer-events:none;
}
.dock-bar{
  pointer-events:auto;max-width:520px;margin:0 auto;height:68px;padding:0 8px;border-radius:32px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(24px) saturate(130%);backdrop-filter:blur(24px) saturate(130%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 12px 32px rgba(214,100,145,.14), inset 0 1px 0 rgba(255,255,255,.95);
}
.dock button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;margin:0 2px;padding:0;
  border:0;border-radius:24px;background:transparent;color:var(--ink-2);font-size:11px;font-weight:600;
}
.dock button[aria-current="page"]{background:var(--pink);color:var(--ink);font-weight:700}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,12px);z-index:30;
  max-width:min(440px, calc(100vw - 32px));padding:12px 18px;border-radius:18px;background:var(--pink-2);color:var(--ink);
  font-weight:600;font-size:13px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.wel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px))}
.wel.fade{opacity:0;transition:opacity .25s ease}
.wel-blur{position:absolute;inset:0;background:rgba(240,240,240,.42);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

<script>

(function () {

  var MIN_SOAL = PG.minJawabanSoal || 2;       // soal dinilai setelah dijawab minimal sekian kali

  /* ---------- penyimpanan (aman jika localStorage diblokir) ---------- */

  function parse(s, fb) { try { return s ? JSON.parse(s) : fb; } catch (e) { return fb; } }

  /* ---------- data soal ---------- */

  var ALL = [];     // semua id soal berurutan dari bab pertama

  D.bab.forEach(function (b) {

  /* ---------- util ---------- */

    } catch (e) { return iso; }
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var LET = ['A', 'B', 'C', 'D'];

  var P = {

  }

  /* ---------- riwayat ujian ---------- */
  function validRec(x) {
    return x && typeof x === 'object' && typeof x.id === 'string' && x.id.length > 0 && x.id.length <= 40 &&
      typeof x.tanggal === 'string' && !isNaN(new Date(x.tanggal).getTime()) &&
      Number.isInteger(x.benar) && Number.isInteger(x.salah) && x.benar >= 0 && x.salah >= 0 && x.benar + x.salah > 0;
  }
  function cleanRec(x) {
    var total = x.benar + x.salah;
    return {
      id: x.id,
      tanggal: new Date(x.tanggal).toISOString(),
      benar: x.benar, salah: x.salah, total: total,
      nilai: Math.round(x.benar / total * 1000) / 10,
      durasi: Number.isFinite(x.durasi) && x.durasi >= 0 ? Math.round(x.durasi) : 0,
      waktuHabis: !!x.waktuHabis,
      detail: cleanDetail(x.detail)
    };
  }
  // detail: id soal -> 1 (benar), 0 (salah), -1 (tidak sempat dijawab karena waktu habis)
  function cleanDetail(d) {
    var o = {}, n = 0;
    if (!d || typeof d !== 'object' || Array.isArray(d)) return o;
    Object.keys(d).forEach(function (k) {
      if (n < 1000 && k.length <= 40 && k !== '__proto__' && (d[k] === 1 || d[k] === 0 || d[k] === -1)) { o[k] = d[k]; n++; }
    });
    return o;
  }
  function hasQ(id) { return Object.prototype.hasOwnProperty.call(Q, id); }
  function getHist() {
    var r = parse(sget(K_RIWAYAT), []);
    return Array.isArray(r) ? r.filter(validRec).map(cleanRec) : [];
  }
  function setHist(h) { sset(K_RIWAYAT, JSON.stringify(h)); }
  function stats(h) {
    if (!h.length) return { n: 0, avg: null, max: null, last: null };
    var sum = 0, max = 0;
    h.forEach(function (r) { sum += r.nilai; if (r.nilai > max) max = r.nilai; });
    return { n: h.length, avg: Math.round(sum / h.length * 10) / 10, max: max, last: h[h.length - 1].nilai };
  }

  /* ---------- analisis penguasaan (dari riwayat ujian) ---------- */
  function statusBab(n, pct) {
    if (n < MIN_BAB) return { k: 'data', t: 'Belum cukup data' };
    if (pct >= BATAS_KUASAI) return { k: 'kuasai', t: 'Dikuasai' };
    if (pct >= BATAS_CUKUP) return { k: 'cukup', t: 'Cukup' };
    return { k: 'belum', t: 'Belum dikuasai' };
  }
  function analisis(h) {
    var perSoal = {}, perBab = {}, ada = false;
    D.bab.forEach(function (b) { perBab[b.id] = { b: b, benar: 0, salah: 0 }; });
    h.forEach(function (r) {
      Object.keys(r.detail || {}).forEach(function (id) {
        var c = r.detail[id];
        if (!hasQ(id) || c === -1) return;   // soal yang tidak sempat dijawab tidak dihitung
        ada = true;
        var s = perSoal[id] || (perSoal[id] = { id: id, benar: 0, salah: 0 });
        var bb = perBab[Q[id].babId];
        if (c === 1) { s.benar++; bb.benar++; } else { s.salah++; bb.salah++; }
      });
    });
    var bab = D.bab.map(function (b) {
      var x = perBab[b.id], n = x.benar + x.salah, pct = n ? Math.round(x.benar / n * 100) : 0;
      return { b: b, n: n, pct: pct, st: statusBab(n, pct) };
    });
    var salah = [], benar = [];
    ALL.forEach(function (id) {
      var s = perSoal[id];
      if (!s) return;
      var n = s.benar + s.salah;
      if (n < MIN_SOAL) return;
      if (s.salah === 0) benar.push(s);
      else if (s.salah / n * 100 >= BATAS_SALAH) salah.push(s);
    });
    salah.sort(function (a, b) {
      return (b.salah / (b.benar + b.salah)) - (a.salah / (a.benar + a.salah)) || b.salah - a.salah;
    });
    return { ada: ada, bab: bab, salah: salah, benar: benar };
  }

  /* ---------- status aplikasi ---------- */
  var view = readHash();
  var lat = { fase: 'awal', list: [], i: 0, ans: {}, b: 'semua', label: '' };
  var aktif = loadAktif();      // ujian yang sedang berjalan
  var ujHasil = null;           // hasil ujian terakhir (ditampilkan sekali)
  var navOpen = false;          // pop-up navigasi nomor soal
  var calcOpen = false;         // pop-up kalkulator
  var calc = null;              // status kalkulator (diisi di bagian kalkulator)
  var confirming = false;       // panel konfirmasi akhiri ujian
  var hapusConfirm = false;     // panel konfirmasi hapus riwayat
  var cadangan = null;          // teks cadangan untuk disalin manual
  var lastView = null;

  function readHash() {
    var h = (location.hash || '').replace('#', '');
    return VIEWS.indexOf(h) >= 0 ? h : 'beranda';
  }
  function loadAktif() {
    var a = parse(sget(K_AKTIF), null);
    if (!a || !Array.isArray(a.ids) || !a.ids.length || typeof a.endAt !== 'number' || typeof a.startAt !== 'number') return null;
    for (var i = 0; i < a.ids.length; i++) { if (!Q[a.ids[i]]) return null; }

    a.flags = fl;
    a.idx = Math.min(Math.max(0, a.idx | 0), a.ids.length - 1);
    return a;

  /* ----- grafik nilai ----- */
  function chart(h) {
    var d = h.slice(-7), n = d.length;
    if (!n) return '<p class="empty">Belum ada data. Selesaikan satu ujian untuk melihat grafik nilai.</p>';
    var x0 = 40, x1 = 292, base = 130;

      return { x: n === 1 ? 166 : x0 + i * (x1 - x0) / (n - 1), y: base - r.nilai, r: r, no: h.length - n + i + 1 };

    s += '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E07BA3" stop-opacity="0.30"/><stop offset="1" stop-color="#E07BA3" stop-opacity="0"/></linearGradient></defs>';

      s += '<line class="gl" x1="30" y1="' + (base - v) + '" x2="312" y2="' + (base - v) + '"/>';

  /* ----- kalkulator ----- */
  var OPSYM = { '+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7' };
  function calcBaru() { return { cur: '0', acc: null, op: null, fresh: false, expr: '', err: false }; }
  calc = calcBaru();
  function cFmt(x) {
    x = String(x);
    if (/e/i.test(x)) return x.replace('.', ',');
    var neg = x.charAt(0) === '-'; if (neg) x = x.slice(1);
    var p = x.split('.'), ip = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + ip + (p.length > 1 ? ',' + p[1] : '');
  }
  function cHitung(a, o, b) {
    var r = o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : (b === 0 ? NaN : a / b);
    if (!isFinite(r)) return null;
    return String(parseFloat(r.toPrecision(12)));
  }
  function cError() { calc = calcBaru(); calc.err = true; }
  function cTekan(k) {
    if (calc.err && k !== 'C') calc = calcBaru();
    var c = calc, r;
    if (k.length === 1 && k >= '0' && k <= '9') {
      if (c.fresh) { c.cur = k; c.fresh = false; }
      else if (c.cur.replace(/[-.]/g, '').length < 15) c.cur = c.cur === '0' ? k : (c.cur === '-0' ? '-' + k : c.cur + k);
    } else if (k === '.') {
      if (c.fresh) { c.cur = '0.'; c.fresh = false; }
      else if (c.cur.indexOf('.') < 0) c.cur += '.';
    } else if (k === 'C') {
      calc = calcBaru();
    } else if (k === 'B') {
      if (!c.fresh) c.cur = (c.cur.length > 1 && !(c.cur.length === 2 && c.cur.charAt(0) === '-')) ? c.cur.slice(0, -1) : '0';
    } else if (k === 'N') {
      if (c.cur !== '0' && c.cur !== '0.') c.cur = c.cur.charAt(0) === '-' ? c.cur.slice(1) : '-' + c.cur;
    } else if (k === '%') {
      c.cur = String(parseFloat((parseFloat(c.cur) / 100).toPrecision(12))); c.fresh = true;
    } else if (OPSYM[k]) {
      if (c.op && c.acc !== null && !c.fresh) {
        r = cHitung(c.acc, c.op, parseFloat(c.cur));
        if (r === null) { cError(); return; }
        c.acc = parseFloat(r); c.cur = r;
      } else c.acc = parseFloat(c.cur);
      c.op = k; c.fresh = true; c.expr = cFmt(c.cur) + ' ' + OPSYM[k];
    } else if (k === '=') {
      if (c.op && c.acc !== null) {
        var b = c.fresh ? c.acc : parseFloat(c.cur);
        r = cHitung(c.acc, c.op, b);
        if (r === null) { cError(); return; }
        c.expr = cFmt(c.acc) + ' ' + OPSYM[c.op] + ' ' + cFmt(b) + ' =';
        c.cur = r; c.acc = null; c.op = null; c.fresh = true;
      }
    }
  }
  function calcTeks() { return calc.err ? 'Tidak valid' : cFmt(calc.cur); }
  function calcUkuran(t) { return t.length > 14 ? 22 : (t.length > 10 ? 28 : 36); }
  function calcUpdate() {
    var d = document.getElementById('calcd'), e = document.getElementById('calce');
    if (!d || !e) return;
    var t = calcTeks();
    d.textContent = t; d.style.fontSize = calcUkuran(t) + 'px';
    e.textContent = calc.expr || '\u00a0';
  }
  function vCalcPopup() {
    var K = [
      ['C', 'C', 'fn', 'Hapus semua'], ['B', ic('bksp', 22), 'fn', 'Hapus satu angka'], ['%', '%', 'fn', 'Persen'], ['/', '\u00f7', 'op', 'Bagi'],
      ['7', '7'], ['8', '8'], ['9', '9'], ['*', '\u00d7', 'op', 'Kali'],
      ['4', '4'], ['5', '5'], ['6', '6'], ['-', '\u2212', 'op', 'Kurang'],
      ['1', '1'], ['2', '2'], ['3', '3'], ['+', '+', 'op', 'Tambah'],
      ['N', '\u00b1', 'fn', 'Ubah positif atau negatif'], ['0', '0'], ['.', ',', '', 'Koma desimal'], ['=', '=', 'op', 'Sama dengan']
    ];
    var t = calcTeks();
    return '<div class="ov" data-act="calc-tutup"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="calct" data-act="noop">' +
      '<div class="sheet-h"><h2 class="h2" id="calct">Kalkulator</h2><button type="button" class="iconbtn" data-act="calc-tutup" aria-label="Tutup kalkulator">' + ic('x', 18) + '</button></div>' +
      '<div class="cdisp"><div class="ce" id="calce">' + (calc.expr ? esc(calc.expr) : '&nbsp;') + '</div><div class="cd" id="calcd" style="font-size:' + calcUkuran(t) + 'px">' + esc(t) + '</div></div>' +
      '<div class="ckeys">' + K.map(function (x) {
        return '<button type="button" class="ck' + (x[2] ? ' ' + x[2] : '') + '" data-act="calc-key" data-k="' + x[0] + '"' + (x[3] ? ' aria-label="' + x[3] + '"' : '') + '>' + x[1] + '</button>';
      }).join('') + '</div></div></div>';
  }

  /* ----- progres ----- */
  function vProgres() {
    var h = getHist(), st = stats(h);
    var html = '<h1 class="h1">Progres Ujian</h1><p class="lead">Riwayat nilai dari ujian quiz yang sudah kamu selesaikan.</p>' + statsHtml(st);
    html += '<section class="glass card"><h2 class="h2"><span class="dot"></span>Perkembangan Nilai</h2>' + chart(h) + '</section>';
    html += vPenguasaan(h, analisis(h));
    html += '<section class="glass card"><h2 class="h2"><span class="dot"></span>Riwayat</h2>';
    if (!h.length) html += '<p class="empty">Belum ada riwayat ujian.</p>';
    else {
      html += '<ul class="hist">';
      h.slice().reverse().forEach(function (r) {
        html += '<li><div class="hn"><b>' + esc(fmtDate(r.tanggal)) + '</b><span>' + r.benar + ' benar, ' + r.salah + ' salah' + (r.waktuHabis ? ', waktu habis' : '') + '</span></div><span class="nv">' + fmtNum(r.nilai) + '</span></li>';
      });
      html += '</ul>';
    }
    html += '</section>';
    html += '<section class="glass card"><h2 class="h2"><span class="dot"></span>Cadangan riwayat</h2>' +
      '<p class="lead">Riwayat tersimpan di browser ini saja. Simpan cadangan agar tidak hilang saat data browser dihapus atau saat berganti HP.</p>' +
      '<div class="row"><button type="button" class="btn btn-ghost" data-act="pr-salin"' + (h.length ? '' : ' disabled') + '>Salin cadangan</button>' +
      (window.QL_CAN_DOWNLOAD ? '<button type="button" class="btn btn-ghost" data-act="pr-unduh"' + (h.length ? '' : ' disabled') + '>Unduh file</button>' : '') + '</div>';
    if (cadangan) html += '<label for="cad" class="note">Salin teks berikut secara manual:</label><textarea id="cad" readonly>' + esc(cadangan) + '</textarea>';
    html += '<label for="imp" class="note">Pulihkan dari cadangan: tempel teks cadangan atau pilih file.</label>' +
      '<textarea id="imp" placeholder="Tempel teks cadangan di sini"></textarea>' +
      '<div class="row"><button type="button" class="btn btn-sm" data-act="pr-pulihkan">Pulihkan</button>' +
      '<span class="btn btn-ghost btn-sm filebtn">Pilih file cadangan<input type="file" id="impFile" accept=".json,application/json,text/plain" aria-label="Pilih file cadangan"></span></div></section>';
    if (h.length) {
      if (hapusConfirm) html += '<div class="confirm"><p><b>Hapus semua riwayat ujian?</b> Tindakan ini tidak bisa dibatalkan.</p><div class="row"><button type="button" class="btn" data-act="pr-hapus-ya">Ya, hapus</button><button type="button" class="btn btn-ghost" data-act="pr-hapus-batal">Batal</button></div></div>';
      else html += '<button type="button" class="btn btn-ghost btn-block" data-act="pr-hapus">Hapus semua riwayat</button>';
    }
    return html;
  }

  function soalItem(s, tipe) {
    var q = Q[s.id], n = s.benar + s.salah;
    var info = tipe === 'salah' ? 'Salah ' + s.salah + ' dari ' + n + ' kali' : 'Benar ' + s.benar + ' dari ' + n + ' kali';
    return '<li><div class="qt">' + esc(q.tanya) + '</div><div class="qm"><span class="chip">' + esc(q.babJudul.split('.')[0]) + '</span><span class="small muted">' + info + '</span></div></li>';
  }
  function daftarSoal(judul, list, tipe, kosong) {
    var html = '<section class="glass card"><h2 class="h2"><span class="dot"></span>' + judul + '</h2>';
    if (!list.length) return html + '<p class="empty">' + kosong + '</p></section>';
    html += '<ul class="qlist">' + list.slice(0, 10).map(function (s) { return soalItem(s, tipe); }).join('') + '</ul>';
    if (list.length > 10) html += '<p class="note">Dan ' + (list.length - 10) + ' soal lainnya.</p>';
    if (tipe === 'salah') html += '<button type="button" class="btn btn-block" data-act="lat-mulai" data-b="salah">' + ic('pencil', 18) + 'Latih soal-soal ini</button>';
    return html + '</section>';
  }
  function vPenguasaan(h, an) {
    var html = '<section class="glass card"><h2 class="h2"><span class="dot"></span>Penguasaan per Bab</h2>';
    if (!h.length) return html + '<p class="empty">Selesaikan satu ujian untuk melihat bab yang sudah dan belum kamu kuasai.</p></section>';
    if (!an.ada) return html + '<p class="empty">Ujian sebelumnya belum mencatat hasil per soal. Analisis muncul setelah ujian berikutnya selesai.</p></section>';
    html += '<ul class="mast">';
    an.bab.forEach(function (x) {
      var teks = !x.n ? 'Belum ada jawaban' : (x.n < MIN_BAB ? 'Baru ' + x.n + ' jawaban (minimal ' + MIN_BAB + ' agar dinilai)' : x.n + ' jawaban, ' + x.pct + '% benar');
      html += '<li class="mrow"><div class="mtop"><span class="mt">' + esc(x.b.judul) + '</span><span class="pill pill-' + x.st.k + '">' + x.st.t + '</span></div>' +
        '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + x.pct + '" aria-label="Persentase benar ' + esc(x.b.judul) + '"><i style="width:' + x.pct + '%"></i></div>' +
        '<div class="mbot"><span class="small muted">' + teks + '</span><button type="button" class="btn btn-ghost btn-sm" data-act="lat-mulai" data-b="' + x.b.id + '">Latih</button></div></li>';
    });
    html += '</ul><p class="note">Dihitung dari semua jawaban di riwayat ujian. Dikuasai mulai ' + BATAS_KUASAI + '% benar, Cukup mulai ' + BATAS_CUKUP + '%. Soal yang tidak sempat dijawab karena waktu habis tidak ikut dihitung.</p></section>';
    html += daftarSoal('Soal yang Sering Salah', an.salah, 'salah', 'Belum ada soal yang sering salah. Soal baru dinilai setelah dijawab minimal ' + MIN_SOAL + ' kali.');
    html += daftarSoal('Soal yang Selalu Benar', an.benar, 'benar', 'Belum ada soal yang dijawab benar terus. Soal baru dinilai setelah dijawab minimal ' + MIN_SOAL + ' kali.');
    return html;
  }

  function cadanganJson() {
    return JSON.stringify({ app: 'quizlearn', versi: 2, diekspor: new Date().toISOString(), riwayat: getHist() });
  }
  function pulihkan(text) {
    var obj = parse((text || '').trim(), null);
    var arr = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.riwayat) ? obj.riwayat : null);
    if (!arr) { toast('Teks cadangan tidak dikenali. Pastikan disalin utuh.'); return; }
    var valid = arr.filter(validRec).map(cleanRec);
    if (!valid.length) { toast('Tidak ada riwayat yang valid di cadangan ini.'); return; }
    var h = getHist(), ada = {}, tambah = 0;
    h.forEach(function (r) { ada[r.id] = true; });
    valid.forEach(function (r) { if (!ada[r.id]) { ada[r.id] = true; h.push(r); tambah++; } });
    h.sort(function (a, b) { return new Date(a.tanggal) - new Date(b.tanggal); });
    setHist(h);
    toast(tambah + ' riwayat berhasil dipulihkan.');
    render();
  }

  /* ---------- aksi ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    var act = t.getAttribute('data-act');
    var a = aktif;

    if (act === 'noop') return;
    if (act === 'go') { go(t.getAttribute('data-v')); return; }

    if (act === 'lat-mulai') { latMulai(t.getAttribute('data-b')); return; }
    if (act === 'lat-jawab') {
      var lid = lat.list[lat.i];
      if (lat.fase !== 'jalan' || lat.ans[lid] !== undefined) return;
      lat.ans[lid] = parseInt(t.getAttribute('data-k'), 10);
      render(); return;
    }
    if (act === 'lat-prev') { if (lat.i > 0) lat.i--; render({ top: true }); return; }
    if (act === 'lat-next') { if (lat.i < lat.list.length - 1) lat.i++; render({ top: true }); return; }
    if (act === 'lat-ke') { lat.i = parseInt(t.getAttribute('data-i'), 10); navOpen = false; render({ top: true }); return; }
    if (act === 'lat-akhiri') { if (latHitung().dj >= lat.list.length) { lat.fase = 'selesai'; navOpen = false; render({ top: true }); } return; }
    if (act === 'lat-ulang') { latMulai(lat.b); return; }
    if (act === 'lat-keluar') { lat = latBaru(); navOpen = false; render({ top: true }); return; }

    if (act === 'uj-mulai') { ujMulai(); return; }
    if (act === 'uj-ulang') { ujHasil = null; render({ top: true }); return; }
    if (!a && act.indexOf('uj-') === 0) return;
    if (act === 'uj-jawab') { a.answers[a.ids[a.idx]] = parseInt(t.getAttribute('data-k'), 10); confirming = false; saveAktif(); render(); return; }
    if (act === 'uj-ke') { a.idx = parseInt(t.getAttribute('data-i'), 10); confirming = false; navOpen = false; saveAktif(); render({ top: true }); return; }
    if (act === 'uj-ragu') { var rid = a.ids[a.idx]; if (a.answers[rid] === undefined || a.answers[rid] === null) return; if (a.flags[rid]) delete a.flags[rid]; else a.flags[rid] = true; saveAktif(); render(); return; }
    if (act === 'calc-buka') { calcOpen = true; navOpen = false; render(); var kb = $ov.querySelector('.iconbtn'); if (kb) kb.focus(); return; }
    if (act === 'calc-tutup') { calcOpen = false; render(); var kc = document.querySelector('[data-act="calc-buka"]'); if (kc) kc.focus(); return; }
    if (act === 'calc-key') { cTekan(t.getAttribute('data-k')); calcUpdate(); return; }
    if (act === 'nav-buka') { navOpen = true; calcOpen = false; render(); var cb = $ov.querySelector('.iconbtn'); if (cb) cb.focus(); return; }
    if (act === 'nav-tutup') { navOpen = false; render(); var nb = document.querySelector('[data-act="nav-buka"]'); if (nb) nb.focus(); return; }
    if (act === 'uj-prev') { if (a.idx > 0) a.idx--; confirming = false; saveAktif(); render({ top: true }); return; }
    if (act === 'uj-next') { if (a.idx < a.ids.length - 1) a.idx++; confirming = false; saveAktif(); render({ top: true }); return; }
    if (act === 'uj-akhiri') { confirming = true; render(); return; }
    if (act === 'uj-batal') { confirming = false; render(); return; }
    if (act === 'uj-ya') { finish(false); return; }

    if (act === 'pr-salin') {
      var json = cadanganJson();
      var fallback = function () { cadangan = json; render(); toast('Salin teks cadangan secara manual dari kotak di bawah.'); };
      try {
        navigator.clipboard.writeText(json).then(function () { cadangan = null; toast('Cadangan disalin. Tempel dan simpan di catatan atau pesan ke diri sendiri.'); }, fallback);
      } catch (err) { fallback(); }
      return;
    }
    if (act === 'pr-unduh') {
      try {
        var blob = new Blob([cadanganJson()], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url; link.download = 'cadangan-quizlearn.json';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        toast('File cadangan diunduh.');
      } catch (err) { toast('Unduh gagal. Gunakan tombol Salin cadangan.'); }
      return;
    }
    if (act === 'pr-pulihkan') { var ta = document.getElementById('imp'); pulihkan(ta ? ta.value : ''); return; }
    if (act === 'pr-hapus') { hapusConfirm = true; render(); return; }
    if (act === 'pr-hapus-batal') { hapusConfirm = false; render(); return; }
    if (act === 'pr-hapus-ya') { setHist([]); hapusConfirm = false; ujHasil = null; toast('Riwayat dihapus.'); render(); return; }
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'impFile' && e.target.files && e.target.files[0]) {
      var rd = new FileReader();
      rd.onload = function () { pulihkan(String(rd.result || '')); };
      rd.onerror = function () { toast('File tidak bisa dibaca.'); };
      rd.readAsText(e.target.files[0]);
    }
  });

  /* ---------- layar sambutan ---------- */
  function welcome() {
    var el = document.createElement('div');
    el.id = 'welcome'; el.className = 'wel'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'welt');
    el.innerHTML = '<div class="wel-blur"></div><div class="wel-body"><div class="logo" aria-hidden="true">' + ic('bolt', 22) + '</div><h1 class="wel-t" id="welt">Are you ready?</h1><button type="button" class="btn wel-btn" id="welbtn">I am ready!</button></div>';
    document.body.appendChild(el);
    var inertEls = [document.querySelector('.app'), document.getElementById('dock')];
    inertEls.forEach(function (x) { if (x) x.setAttribute('inert', ''); });
    document.body.style.overflow = 'hidden';
    var btn = document.getElementById('welbtn'), blur = el.querySelector('.wel-blur'), body = el.querySelector('.wel-body');
    btn.focus();
    var busy = false;
    function selesai() {
      if (el.parentNode) el.parentNode.removeChild(el);
      inertEls.forEach(function (x) { if (x) x.removeAttribute('inert'); });
      document.body.style.overflow = navOpen ? 'hidden' : '';
      try { $main.focus({ preventScroll: true }); } catch (e) {}
    }
    btn.addEventListener('click', function () {
      if (busy) return; busy = true;
      var r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var W = window.innerWidth, H = window.innerHeight;
      var dx = Math.max(cx, W - cx), dy = Math.max(cy, H - cy);
      var soft = 160, total = Math.sqrt(dx * dx + dy * dy) + soft;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      body.classList.add('out');
      if (reduce || !window.requestAnimationFrame) { el.classList.add('fade'); setTimeout(selesai, 260); return; }
      var dur = 1100, t0 = null;
      function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function frame(ts) {
        if (t0 === null) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur), R = ease(p) * total;
        var s = Math.min(soft, R);
        var m = 'radial-gradient(circle at ' + cx + 'px ' + cy + 'px, transparent ' + R + 'px, #000 ' + (R + s) + 'px)';
        blur.style.webkitMaskImage = m; blur.style.maskImage = m;
        if (p < 1) requestAnimationFrame(frame); else selesai();
      }
      requestAnimationFrame(frame);
    });
  }

  /* ---------- mulai ---------- */
  if (aktif && aktif.endAt <= Date.now()) {
    finish(true);
    toast('Waktu ujian sebelumnya sudah habis. Hasil tersimpan di Progres.');
  } else {
    render();
  }
  if (!aktif) welcome();   // ujian yang sedang berjalan tidak ditunda oleh layar sambutan
})();

</script>

</body></html>
