<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7fa">
  <meta name="description" content="Pilih mata kuliah untuk membuka kuis.">
  <title>QuizLearn — Mata Kuliah</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #57263e;
      --pink: #f4b6ce;
      --pink-soft: #fde8f0;
      --pink-pale: #fff7fa;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 0% 12%, rgba(250, 210, 226, .58), transparent 34rem),
        radial-gradient(ellipse at 100% 88%, rgba(244, 182, 206, .42), transparent 32rem),
        linear-gradient(145deg, #ffffff 0%, var(--pink-pale) 100%);
    }
    main {
      width: min(100% - 40px, 680px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 0;
    }
    .courses {
      display: grid;
      width: 100%;
      gap: 18px;
    }
    .course {
      position: relative;
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 116px;
      padding: 22px 24px;
      overflow: hidden;
      color: var(--ink);
      text-decoration: none;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(238, 183, 205, .72);
      border-radius: 25px;
      box-shadow: 0 12px 32px rgba(133, 66, 94, .075), inset 0 1px 0 rgba(255,255,255,.9);
      -webkit-tap-highlight-color: transparent;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .course::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -70px;
      top: -82px;
      border-radius: 50%;
      background: rgba(249, 213, 227, .48);
      pointer-events: none;
    }
    .course:active { transform: scale(.985); }
    .course:focus-visible {
      outline: 3px solid #d978a1;
      outline-offset: 4px;
    }
    .course-icon {
      position: relative;
      z-index: 1;
      flex: 0 0 62px;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 19px;
      background: linear-gradient(145deg, #f9d5e3, #efabc7);
      box-shadow: 0 6px 16px rgba(198, 104, 143, .15);
    }
    .course-icon svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: #71334f;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .course-name {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(18px, 4.8vw, 23px);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -.45px;
    }
    @media (min-width: 600px) {
      .courses { gap: 20px; }
      .course { min-height: 132px; padding: 26px 30px; }
      .course-icon { width: 70px; height: 70px; flex-basis: 70px; border-radius: 21px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .course { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="courses" aria-label="Mata kuliah">
      <a class="course" href="./pemasaran-jasa/" aria-label="Pemasaran Jasa">
        <span class="course-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 4.5 7.2v9.6L12 21l7.5-4.2V7.2L12 3Z"/><path d="m8.5 10 3.5-2 3.5 2v4L12 16l-3.5-2v-4Z"/><path d="m4.8 7.4 7.2 4 7.2-4M12 11.5V21"/></svg>
        </span>
        <h1 class="course-name">Pemasaran Jasa</h1>
      </a>
      <a class="course" href="./manajemen-strategik/" aria-label="Manajemen Strategik">
        <span class="course-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 2 5-6"/><path d="M15.5 7H19v3.5"/></svg>
        </span>
        <h2 class="course-name">Manajemen Strategik</h2>
      </a>
    </nav>
  </main>
</body>
</html>
